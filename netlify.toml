# Netlify configuration: Hanumant Marble storefront + the stock ERP

[build]
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  # Node.js version
  NODE_VERSION = "24.14.1"
  # Next.js specific
  NEXT_PUBLIC_ENV = "production"
  # The only hosts that serve Hanumant Marble's public storefront (proxy.js).
  # Every other host (stock.hanumantmarble.com, previews, other companies'
  # domains) serves just the stock ERP.
  NEXT_PUBLIC_STOREFRONT_HOSTS = "hanumantmarble.com,www.hanumantmarble.com"

[[plugins]]
package = "@netlify/plugin-nextjs"

# Environment-based behavior
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

# Headers for security and SEO
[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/stock/*"
  
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "private, no-cache, no-store, must-revalidate"

[[headers]]
  for = "/api/stock/*"
  
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
    Cache-Control = "private, no-cache, max-age=0"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"
